name: Build Preview

on:
  pull_request:
    branches: [ develop ]

jobs:
  quick-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Quick build test - Builder stage
        uses: docker/build-push-action@v5
        with:
          context: .
          target: builder
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Quick build test - Production stage
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Quick build test - Slim image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.slim
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-status:
    runs-on: ubuntu-latest
    needs: quick-build
    if: always()
    
    steps:
      - name: Set status check
        if: needs.quick-build.result == 'success'
        run: echo "✅ All builds completed successfully"
      
      - name: Notify on failure
        if: needs.quick-build.result == 'failure'
        run: |
          echo "❌ Build failed"
          exit 1
